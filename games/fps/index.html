<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FPS Nexx.web</title>
  <style>html,body{height:100%;margin:0;overflow:hidden} #blocker{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:3} #instructions{color:#fff;max-width:720px;text-align:center} #crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;z-index:2;pointer-events:none}
  #hud{position:fixed;left:12px;top:12px;z-index:3;color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}
  #hud div{margin-bottom:6px;background:rgba(0,0,0,0.4);padding:6px 10px;border-radius:6px}
  </style>
</head>
<body>
  <div id="blocker"><div id="instructions"><h1>FPS Nexx.web</h1><p>Click para entrar (pointer lock). WASD mover, ratón mirar, click disparar, 1/2/3 para cambiar arma.</p><p>Armas: 1 Franco, 2 AK, 3 Escopeta</p></div></div>
  <div id="hud"><div id="hp">Salud: 100</div><div id="wep">Arma: AK</div><div id="info">Bots activos</div></div>
  <div id="crosshair">+</div>

  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.155.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="app.js"></script>
</body>
</html>
