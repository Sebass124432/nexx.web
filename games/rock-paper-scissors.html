<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Piedra Papel Tijeras</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #05050a; color: #fff; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .container{ width:min(640px,96%); background:rgba(10,10,18,0.95); border-radius:12px; padding:2rem; box-shadow:0 10px 40px rgba(0,0,0,0.6); text-align:center }
    h1{ margin:0 0 0.25rem 0; font-size:1.6rem; letter-spacing:0.08em }
    p.sub{ color:rgba(255,255,255,0.7); margin:0 0 1rem 0 }
    .choices{ display:flex; gap:0.6rem; justify-content:center; margin:1rem 0 }
    .choice{ background:linear-gradient(135deg,#fff,#ccc); color:#05050a; border:none; padding:0.9rem 1.2rem; border-radius:10px; font-weight:700; cursor:pointer }
    .result{ margin-top:1rem; font-size:1.05rem }
    .score{ display:flex; gap:1rem; justify-content:center; margin-top:0.8rem; color:rgba(255,255,255,0.8) }
    .small{ font-size:0.9rem; color:rgba(255,255,255,0.65) }
    a.back{ display:inline-block; margin-top:1rem; color:rgba(255,255,255,0.85); text-decoration:underline }
  </style>
</head>
<body>
  <div class="container">
    <h1>Piedra • Papel • Tijeras</h1>
    <p class="sub">Juega contra la máquina. Elige una opción abajo.</p>

    <div class="choices">
      <button class="choice" data-move="piedra">✊ Piedra</button>
      <button class="choice" data-move="papel">✋ Papel</button>
      <button class="choice" data-move="tijeras">✌️ Tijeras</button>
    </div>

    <div class="result" id="result">Elige una opción para empezar.</div>
    <div class="score"><div>Jugador: <strong id="playerScore">0</strong></div><div>Máquina: <strong id="cpuScore">0</strong></div></div>
    <div class="small">Mejor de 5 gana. Presiona la opción para jugar otra ronda.</div>
    <a class="back" href="../index.html">← Volver</a>
  </div>

  <script>
    const choices = document.querySelectorAll('.choice');
    const resultEl = document.getElementById('result');
    const playerScoreEl = document.getElementById('playerScore');
    const cpuScoreEl = document.getElementById('cpuScore');
    let playerScore = 0, cpuScore = 0;

    function cpuMove(){
      const opts = ['piedra','papel','tijeras'];
      return opts[Math.floor(Math.random()*opts.length)];
    }

    function decide(player, cpu){
      if(player === cpu) return 'Empate';
      if(
        (player === 'piedra' && cpu === 'tijeras') ||
        (player === 'papel' && cpu === 'piedra') ||
        (player === 'tijeras' && cpu === 'papel')
      ) return 'Ganaste';
      return 'Perdiste';
    }

    function updateScores(res){
      if(res === 'Ganaste') playerScore++;
      if(res === 'Perdiste') cpuScore++;
      playerScoreEl.textContent = playerScore;
      cpuScoreEl.textContent = cpuScore;
    }

    choices.forEach(btn => btn.addEventListener('click', () => {
      const player = btn.dataset.move;
      const cpu = cpuMove();
      const res = decide(player,cpu);
      resultEl.textContent = `Tú: ${player} — Máquina: ${cpu} → ${res}`;
      updateScores(res);
      if(playerScore === 3 || cpuScore === 3){
        resultEl.textContent += ` — ${playerScore>cpuScore? 'Has ganado la partida!':'La máquina gana la partida.'}`;
        playerScore = 0; cpuScore = 0;
      }
    }));
  </script>
</body>
</html>
